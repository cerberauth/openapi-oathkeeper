name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - uses: cerberauth/ci/actions/go-build-test@main
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Builds the real CLI, generates Ory Oathkeeper access rules from a
      # test OpenAPI document, and loads them into a real, unmodified Ory
      # Oathkeeper gateway (via Docker, --network host) to exercise them
      # with real HTTP requests. See test/integration for details.
      - name: Run integration tests against a real Oathkeeper instance
        run: go test -tags=integration -v ./test/integration/...

